# Chocofi (built with the corne shield + five_column_transform).
# Keep in sync with cradio.conf — everything except the keyboard name
# should be identical across keyboards.
CONFIG_ZMK_KEYBOARD_NAME="Reza's Chocofi"
CONFIG_ZMK_SLEEP=y
CONFIG_BT=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
